<html>
    <head>
        <title>HORIZONTAL LIST</title>
        <style>
            .div{
                h1{
                    font-size: xx-large;  margin: 2px;   padding: 30px;  color: brown;  border-radius: 20px;    }
                ul{
                    font-display: center; margin: 20px;  padding: 30px; font-size: smaller; }
                li{
                    margin-top: 30px; margin-left: 35px; display:inline-block; text-decoration: none; 
                   display: inline;
                    display: inline-block;
                    float: left;
                    display: inline;
                    display: inline-block;
            
                }
                
                
            }

        </style>
    </head>
    <body>
        <h1>unordered list</h1>
        <ul>
            <li>name</li>
            <li>student</li>
            <li>college</li>
            <li>branch</li>
            <li>email</li>
            <li>number</li>
        </ul>
    </body>
</html>
